<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta
      name="description"
      content="محرك بحث قانوني ذكي متخصص في نقض الأحكام والقضايا الإدارية العليا"
    />
    <meta
      name="keywords"
      content="قانون, محاماة, أحكام, نقض, إدارية عليا, مستشار قانوني"
    />
    <meta name="author" content="Legal Chatbot Team" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="مستشار القوانين الذكي" />
    <meta
      property="og:description"
      content="محرك بحث قانوني مدعوم بالذكاء الاصطناعي"
    />
    <meta property="og:site_name" content="مستشار القوانين" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⚖️</text></svg>" />
    
    <title>مستشار القوانين الذكي</title>
    
    <style>
      /* Prevent layout shift while loading */
      html {
        scroll-behavior: smooth;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      /* Loading spinner */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
        color: white;
        font-size: 1.2rem;
      }
      
      .loading-spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-right: 1rem;
      }
      
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Root element for React -->
    <div id="root">
      <div class="loading">
        <div class="loading-spinner"></div>
        <span>جاري التحميل...</span>
      </div>
    </div>
    
    <!-- Main React app script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker registration (optional, for PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Service worker registration failed, app will still work
          });
        });
      }
    </script>
  </body>
</html>
